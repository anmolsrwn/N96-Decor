<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Venues | N96 Decor</title>
  <meta name="description" content="Weddings and celebrations designed by N96 Decor in this city.">
  <link rel="icon" href="images/brand/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Italiana&family=Raleway:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="city">
<div class="sheet">
  <header id="site-header"></header>
  <main>
    <!-- Filled from js/data.js: the city after # in the address (e.g. city.html#goa)
         and every project whose  city: "goa"  matches. -->
    <section class="page-banner"><div class="wrap" id="city-banner"></div></section>
    <section class="section--tight" style="padding-top:0">
      <div class="wrap">
        <div class="filters" id="city-others" aria-label="Other cities"></div>
        <div class="project-grid project-grid--4" id="city-projects"></div>
        <div class="center mt-l"><a class="btn btn--ghost" href="index.html#venues">Back to the map <span class="arrow">→</span></a></div>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
</div>
<script src="js/data.js"></script>
<script src="js/generated-pages.js"></script>
<script src="js/main.js"></script>
<script src="js/chatbot-answers.js"></script>
<script src="js/chatbot.js"></script>
</body>
</html>
