<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gallery | N96 Decor</title>
  <meta name="description" content="Photo gallery of weddings, florals and set design by N96 Decor.">
  <link rel="icon" href="images/brand/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Italiana&family=Raleway:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="gallery">
<div class="sheet">
  <header id="site-header"></header>
  <main>
    <section class="page-banner">
      <div class="wrap">
        <img class="mark" src="images/brand/logo-mark.png" alt="">
        <span class="eyebrow">Gallery</span>
        <h1>Moments We Made</h1>
        <p>Florals, sets and the small personal details from our celebrations. Tap any photo to view it larger.</p>
      </div>
    </section>
    <section class="section--tight" style="padding-top:0">
      <div class="wrap">
        <div class="filters" id="gallery-filters" role="group" aria-label="Filter photos"></div>
        <div class="masonry" id="gallery-grid"></div>
      </div>
    </section>

    <!-- VIDEOS: every reel from the projects (added automatically from js/data.js) -->
    <section class="section--tight gallery-videos" id="videos">
      <div class="wrap">
        <div class="section-head"><div><span class="eyebrow">Reels</span><h2>Videos</h2></div>
          <p>Reels from our celebrations. Tap the speaker to hear the sound, or the name to open the project.</p></div>
        <div class="video-grid" id="video-grid"></div>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
</div>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/chatbot-answers.js"></script>
<script src="js/chatbot.js"></script>
</body>
</html>
