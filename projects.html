<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Projects | N96 Decor</title>
  <meta name="description" content="Weddings, pre-wedding functions, birthdays, corporate and private celebrations designed by N96 Decor.">
  <link rel="icon" href="images/brand/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Italiana&family=Raleway:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="projects">
<div class="sheet">
  <header id="site-header"></header>
  <main>
    <section class="page-banner">
      <div class="wrap">
        <img class="mark" src="images/brand/logo-mark.png" alt="">
        <span class="eyebrow">Our work</span>
        <h1>All Projects</h1>
        <p>Pick a type of celebration to filter. Click any project to see the full story, details and photos.</p>
      </div>
    </section>
    <section class="section--tight" style="padding-top:0">
      <div class="wrap">
        <div class="filters" id="project-filters" role="group" aria-label="Filter projects by type"></div>
        <div class="project-grid project-grid--4" id="projects-grid"></div>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
</div>
<script src="js/data.js"></script>
<script src="js/generated-pages.js"></script>
<script src="js/main.js"></script>
<script src="js/chatbot-answers.js"></script>
<script src="js/chatbot.js"></script>
</body>
</html>
